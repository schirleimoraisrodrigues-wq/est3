<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Engenharia</title>
    <script>
      window.__terminalEngenhariaBase = location.hostname.endsWith('github.io') && location.pathname.split('/').filter(Boolean)[0]
        ? `/${location.pathname.split('/').filter(Boolean)[0]}/`
        : '/';
      document.write(`<link rel="stylesheet" href="${window.__terminalEngenhariaBase}src/styles.css" />`);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import(`${window.__terminalEngenhariaBase}src/main.js`);
    </script>
  </body>
</html>
